# Builds the three worker images (sd15-worker, sdxl-worker, flux-worker), each on its own
# runner for the disk space, and pushes them to GHCR. Point the RunPod endpoint at the commit
# tag, not :latest: a serverless worker whose code changes between cold starts is hard to debug.
name: Build worker
on:
  push:
    branches: [main]
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - { model: sd15, file: Dockerfile }
          - { model: sdxl, file: Dockerfile }
          - { model: flux, file: Dockerfile.flux }
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - name: Free up disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache /usr/local/share/boost
          df -h /
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.file }}
          push: true
          build-args: MODEL=${{ matrix.model }}
          tags: |
            ghcr.io/${{ github.repository_owner }}/${{ matrix.model }}-worker:latest
            ghcr.io/${{ github.repository_owner }}/${{ matrix.model }}-worker:${{ github.sha }}
